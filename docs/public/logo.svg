<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Lania Tools">
  <title>Lania Tools</title>

  <defs>
    <linearGradient id="space" x1="18" y1="8" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13233d"/>
      <stop offset=".55" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>

    <radialGradient id="nebula" cx="0" cy="0" r="1" gradientTransform="translate(64 64) rotate(90) scale(56)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#42d392" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#3b82f6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="filament" x1="24" y1="98" x2="106" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f9165"/>
      <stop offset=".5" stop-color="#42d392"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="metal" x1="42" y1="34" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#d9fff4"/>
      <stop offset="1" stop-color="#7ce9c4"/>
    </linearGradient>

    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(64 64) scale(9)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#42d392" stop-opacity=".18"/>
      <stop offset="1" stop-color="#42d392" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#space)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="28.25" fill="none" stroke="#42d392" stroke-opacity=".22" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="56" fill="url(#nebula)"/>

  <!-- Laniakea filaments: the supercluster behind the tool -->
  <g fill="none" stroke="url(#filament)">
    <ellipse cx="64" cy="64" rx="48" ry="19" stroke-width="1.3" opacity=".3" transform="rotate(-26 64 64)"/>
    <ellipse cx="64" cy="64" rx="36" ry="13.5" stroke-width="1" opacity=".18" transform="rotate(34 64 64)"/>
    <path d="M26 54c8-17 23-27 42-27 18 0 33 9 40 25" stroke-width="1.7" stroke-linecap="round" opacity=".38"/>
    <path d="M101 78c-7 18-22 28-40 28-17 0-31-8-39-22" stroke-width="1.7" stroke-linecap="round" opacity=".26"/>
  </g>

  <!-- Cluster links radiating from the hex nut -->
  <g stroke="url(#filament)" stroke-width=".9" opacity=".38" stroke-linecap="round">
    <path d="M64 20v16"/>
    <path d="M102 42 87 51"/>
    <path d="M102 86 87 77"/>
    <path d="M64 108V92"/>
    <path d="M26 86 41 77"/>
    <path d="M26 42 41 51"/>
  </g>

  <!-- Hex nut: the tool -->
  <g filter="url(#glow)">
    <path
      d="M64 37 87.38 50.5v27L64 91 40.62 77.5v-27Z
         M76.5 64a12.5 12.5 0 1 0-25 0 12.5 12.5 0 1 0 25 0Z"
      fill="url(#metal)"
      fill-rule="evenodd"
    />
  </g>
  <path
    d="M64 37 87.38 50.5v27L64 91 40.62 77.5v-27Z
       M76.5 64a12.5 12.5 0 1 0-25 0 12.5 12.5 0 1 0 25 0Z"
    fill="none"
    stroke="#42d392"
    stroke-opacity=".35"
    stroke-width=".9"
    fill-rule="evenodd"
  />

  <!-- Socket ring -->
  <circle cx="64" cy="64" r="15" fill="none" stroke="#42d392" stroke-opacity=".4" stroke-width="1.2"/>

  <!-- A single star at the centre of the socket -->
  <circle cx="64" cy="64" r="9" fill="url(#core)"/>
  <circle cx="64" cy="64" r="2.4" fill="#eafff8" filter="url(#softGlow)"/>

  <!-- Cluster nodes -->
  <g fill="#bfffe8" filter="url(#softGlow)">
    <circle cx="64" cy="20" r="2.8"/>
    <circle cx="102" cy="42" r="2.3"/>
    <circle cx="102" cy="86" r="2.5"/>
    <circle cx="64" cy="108" r="2.2"/>
    <circle cx="26" cy="86" r="2.4"/>
    <circle cx="26" cy="42" r="2"/>
  </g>

  <!-- Distant stars -->
  <g fill="#ffffff" opacity=".7">
    <circle cx="101" cy="28" r="1.1"/>
    <circle cx="33" cy="28" r=".9"/>
    <circle cx="113" cy="64" r="1"/>
    <circle cx="16" cy="66" r=".9"/>
    <circle cx="92" cy="106" r=".9"/>
    <circle cx="38" cy="104" r=".8"/>
  </g>
</svg>
